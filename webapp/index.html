<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="MIA Glance — glanceable MIA cards for Meta Ray-Ban Display: needs attention, proposals, tracked, next up, and today's quests.">
<title>MIA Glance</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --bg: #000; --panel: #0d1419; --panel2: #0a1116;
    --line: #22303a; --text: #f2f8fc; --dim: #c2d7e2; --faint: #8fb6c9;
    --accent: #3ec6ff; --accent-ink: #06121a;
    --critical: #ff5a4e; --warning: #ffb02e; --info: #3ec6ff;
    --xp: #ffd166; --ok: #a5d98f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app { display: flex; flex-direction: column; height: 600px; padding: 18px 20px 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .06em; }
  .clock { font-size: 17px; color: #a8c8da; font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; letter-spacing: .1em; color: var(--accent); margin-top: 6px; }
  .xpbar { height: 5px; border-radius: 3px; background: #16202a; margin: 8px 0 10px; overflow: hidden; }
  .xpfill { width: 62%; height: 100%; background: var(--accent); border-radius: 3px; }
  .summary { font-size: 17px; line-height: 1.4; color: #d7e8f2; min-height: 24px; }
  .pagehead { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
  .nav {
    cursor: pointer; font: inherit; font-size: 24px; line-height: 1; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid #2b3d49; background: var(--panel); color: var(--accent);
  }
  .nav:focus-visible, .card:focus-visible, .btn:focus-visible {
    outline: 2px solid #4fd8ff; outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(79,216,255,.25);
  }
  .pagetitle { flex: 1; text-align: center; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2b3d49; }
  .dot.on { background: var(--accent); }
  .page { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--info);
    color: var(--text); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; font: inherit;
  }
  .card.sev-critical { border-left-color: var(--critical); }
  .card.sev-warning { border-left-color: var(--warning); }
  .card.sev-info { border-left-color: var(--info); }
  .card.decided { opacity: .7; }
  .area { display: block; font-size: 11px; letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }
  .ctitle { display: block; font-size: 20px; font-weight: 600; margin-top: 3px; line-height: 1.25; }
  .cdetail { display: block; font-size: 16px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
  .action { font-size: 15px; color: var(--accent); font-weight: 600; }
  .xp { font-size: 15px; color: var(--xp); font-weight: 700; }
  .check {
    display: inline-block; width: 19px; height: 19px; border-radius: 50%;
    border: 2px solid var(--accent); vertical-align: -4px; margin-right: 8px; position: relative;
  }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check.done::after {
    content: ""; position: absolute; left: 5.5px; top: 2.5px; width: 5px; height: 9.5px;
    border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .empty { color: var(--faint); font-size: 16px; padding: 26px 6px; text-align: center; }
  .expand {
    background: var(--panel2); border: 1px solid var(--line); border-left: 5px solid var(--info);
    border-radius: 12px; padding: 14px; margin: -2px 0 12px;
  }
  .expand.sev-critical { border-left-color: var(--critical); }
  .expand.sev-warning { border-left-color: var(--warning); }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: .14em; color: var(--accent-ink);
    background: #7fd8ff; border-radius: 4px; padding: 2px 7px; font-weight: 700; margin-bottom: 9px;
  }
  .dsum { font-size: 16px; color: #d7e8f2; line-height: 1.45; }
  .ev { margin: 11px 0 0; padding-left: 19px; font-size: 15px; color: #b4cdd9; line-height: 1.55; }
  .safety {
    margin-top: 13px; font-size: 14px; color: var(--ok); background: #14210d;
    border: 1px solid #2c4520; border-radius: 8px; padding: 10px 12px; line-height: 1.5;
  }
  .btns { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 100px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 600;
    border-radius: 10px; padding: 12px 10px; border: 1px solid var(--accent);
    background: transparent; color: #7fd8ff;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note { margin-top: 11px; font-size: 14px; color: var(--xp); }
  .full { font-size: 13px; color: #7193a5; margin-top: 11px; }
  .headline { font-size: 28px; font-weight: 700; line-height: 1.2; padding: 14px 4px 4px; }
  .sub { font-size: 16px; color: #a8c8da; padding: 0 4px 12px; }
  .homebtns { display: flex; gap: 8px; }
  .hbtn {
    flex: 1; cursor: pointer; font: inherit; font-size: 16px; font-weight: 600;
    border-radius: 10px; padding: 12px 10px; border: 1px solid var(--accent);
    background: transparent; color: #7fd8ff;
  }
  .hbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hbtn:focus-visible, .askinput:focus-visible {
    outline: 2px solid #4fd8ff; outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(79,216,255,.25);
  }
  .askinput {
    width: 100%; font: inherit; font-size: 16px; padding: 12px; color: var(--text);
    background: var(--panel); border: 1px solid #2b3d49; border-radius: 10px; margin: 0 0 10px;
  }
  .chkrow { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--dim); margin: 0 0 12px; }
  .hint { font-size: 11.5px; color: #7193a5; padding-top: 8px; }
  /* MIA-suggested missions: review cards, confirm gate, celebration */
  .rar {
    display: inline-block; font-size: 11px; letter-spacing: .12em; font-weight: 700;
    border-radius: 4px; padding: 2px 7px; margin-left: 8px; text-transform: uppercase;
  }
  .rar-Common { color: #dfe7ec; background: #3a4750; }
  .rar-Uncommon { color: #06130a; background: #7dd87d; }
  .rar-Rare { color: #06121a; background: #3ec6ff; }
  .rar-Epic { color: #160a1e; background: #c77dff; }
  .rar-Legendary { color: #1e1206; background: #ffb02e; }
  .epic { display: block; font-size: 22px; font-weight: 800; margin-top: 4px; line-height: 1.25; }
  .reason { display: block; font-size: 15px; color: var(--ok); margin-top: 7px; line-height: 1.45; font-style: italic; }
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.88); padding: 34px;
  }
  .cel {
    width: 100%; text-align: center; border-radius: 16px; padding: 28px 22px;
    background: #0d1419; border: 2px solid var(--rc, #3ec6ff);
    box-shadow: 0 0 42px var(--rc, #3ec6ff);
  }
  .cel-kicker { font-size: 13px; letter-spacing: .3em; color: var(--rc, #3ec6ff); font-weight: 800; }
  .cel-epic { font-size: 30px; font-weight: 800; margin: 12px 0 6px; line-height: 1.2; }
  .cel-rewards { margin: 14px 0 4px; font-size: 17px; color: var(--xp); font-weight: 700; line-height: 1.7; }
  .cel-total { font-size: 14px; color: var(--dim); margin-bottom: 18px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">MIA</span>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="status">LEVEL 7 · 1,240 XP · 12-DAY STREAK</div>
  <div class="xpbar"><div class="xpfill"></div></div>
  <div class="summary" id="summary"></div>
  <div class="pagehead">
    <button class="nav" id="navPrev" type="button" aria-label="Previous section">&#8249;</button>
    <div class="pagetitle" id="pagetitle"></div>
    <button class="nav" id="navNext" type="button" aria-label="Next section">&#8250;</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="page" id="page"></div>
  <div class="hint" id="hint">&#8592;&#8594; section · &#8593;&#8595; cards · Enter opens · R refreshes</div>
</div>

<script>
"use strict";
/* Embedded fallback so the app renders even if state.json is unreachable. */
const MOCK = {
  meta: { source: "embedded-fallback" },
  brief: {
    greenhouse: "Cell 2: pH 6.9, EC 1.9 \u2014 all in band.",
    attention: "2 things need you: pH drift high; fish feeder 2 days overdue.",
    proposals: "1 proposal waiting: Test EC target maximum 1.8 \u2192 2.0.",
    quests: "2 quests open, 65 XP available.",
    finance: "October: $1,240 of $2,000 (62%) \u2014 on pace.",
    workout: "5-day streak. Last: Push day, 42 min.",
    kitchen: "Pantry: 24 items tracked \u00b7 2 expiring soon.",
    bills: "Next bill: Internet $80 due in 2 days. 1 more in the next two weeks."
  },
  voice: {
    scripts: {
      who: "I'm MIA, your personal assistant. I run on your own machines, so your life stays yours \u2014 I keep track of it and speak up only when something's useful.",
      can: "I watch your bills and budget, workouts, pantry and recipes, greenhouse, properties, and your quests. Ask what's due, what you can cook, or how your week's going \u2014 and I can log things and add quests when you say yes.",
      help: "Try: 'What needs me?' \u2014 'What's due this week?' \u2014 'Read me a recipe.' \u2014 'Log my workout.' \u2014 or 'Add a quest.'",
      know: "Everything I know lives on your machines \u2014 your modules, missions, and Life State. Nothing leaves unless you send it."
    },
    intents: [
      { intent: "bills", kind: "brief", target: "bills",
        patterns: ["bill", "bills", "what's due", "what is due", "payments"] },
      { intent: "budget", kind: "brief", target: "finance",
        patterns: ["budget", "spending", "money", "how's my budget", "how is my budget"] },
      { intent: "greenhouse", kind: "brief", target: "greenhouse",
        patterns: ["greenhouse", "plants", "cells", "ph"] },
      { intent: "attention", kind: "brief", target: "attention",
        patterns: ["what needs me", "needs me", "what's wrong", "what is wrong", "attention"] },
      { intent: "proposals", kind: "brief", target: "proposals",
        patterns: ["proposal", "proposals", "waiting", "approve"] },
      { intent: "quests", kind: "brief", target: "quests",
        patterns: ["quest", "quests", "mission", "missions", "today"] },
      { intent: "workout", kind: "brief", target: "workout",
        patterns: ["workout", "exercise", "gym", "training", "streak"] },
      { intent: "kitchen", kind: "brief", target: "kitchen",
        patterns: ["kitchen", "pantry", "fridge", "food", "groceries"] }
    ],
    cookbook: [
      { id: "demo-teriyaki", name: "Teriyaki Chicken",
        ingredients: ["1 lb chicken thighs", "1/4 cup soy sauce", "2 tbsp honey", "1 tsp grated ginger"],
        steps: ["Mix the soy sauce, honey, and ginger in a bowl.",
                "Sear the chicken 5 minutes per side over medium-high heat.",
                "Pour in the sauce and simmer 4 minutes, until thick and glossy.",
                "Rest 2 minutes, slice, and serve over rice."],
        time_minutes: 20 }
    ]
  },
  attention: [
    { id: "alert-7", area: "Greenhouse", severity: "critical", title: "pH drift high",
      detail: "Cell 2 (Lettuce Raft) at 7.8 — target 6.8–7.2. Source: cell-2 · 3 occurrences.",
      action: "Open on phone", proposal: null },
    { id: "alert-9", area: "Greenhouse", severity: "warning", title: "Fish feeder 2 days overdue",
      detail: "Feeder A missed its refill window. Fish were fed manually.",
      action: "Open on phone", proposal: null }
  ],
  proposals: [
    { id: "exp-7", area: "Proposals", severity: "warning",
      title: "Test EC target maximum: 1.8 → 2.0",
      detail: "Raising EC max improves lettuce yield.", action: "Review",
      proposal: { real: true, kind: "experiment", row_id: 7,
        title: "Test EC target maximum: 1.8 → 2.0",
        summary: "Raising EC max improves lettuce yield.",
        evidence: ["Raising EC max improves lettuce yield.",
                   "Lettuce Raft: baseline 1.8, test 2.0",
                   "Runs until 2026-10-15", "Proposed by assistant"],
        safety: "Approval changes the target the control loop aims for. Every dose still passes the Safety MCU's hard limits (max pulse, min interval, 24h cap) — approval changes the target, never bypasses safety.",
        approve_label: "Start experiment", dismiss_label: "Dismiss" } }
  ],
  tracked: [
    { id: "trk-cell2", area: "Greenhouse · Cell 2", severity: "info",
      title: "pH 6.9 · EC 1.9 · 24.1°C",
      detail: "All in band. Stable 6 hours — twin agrees with sensors.",
      action: "Open twin", proposal: null }
  ],
  next_up: [
    { id: "maint-4", area: "Greenhouse", severity: "warning", title: "Sharpen mower blades",
      detail: "Overdue 12 days. Next mow window: Saturday.", action: "Open on phone", proposal: null },
    { id: "maint-5", area: "Garage", severity: "info", title: "Winterize pressure washer",
      detail: "First freeze risk in about 3 weeks.", action: "Open on phone", proposal: null }
  ],
  quests: [
    { id: "a1b2c3d4e5", area: "Field Season · Greenhouse", title: "Morning greenhouse check-in",
      detail: "Walk the cell, glance at the twin.", xp: 25 },
    { id: "k1l2m3n4o5", area: "Garage", title: "Calibrate pH pen",
      detail: "Due every 30 days — last done 34 days ago.", xp: 40 }
  ],
  suggested: [
    { id: "gen-rot-horde", area: "Kitchen", title: "Use up the expiring food",
      detail: "Before they turn: milk, spinach.",
      xp: 30, epic_name: "Defeat the Rot Horde!", bonus_tasks: [],
      rarity: "Common", reason: "MIA noticed expiring items: milk, spinach.",
      source: "mia-generated",
      voice: { epic_title: "Defeat the Rot Horde!", rarity: "Common",
        new_mission: "New Mission: Defeat the Rot Horde!",
        complete: "Mission: Defeat the Rot Horde! Complete!",
        reward_lines: ["+30 XP"], total_xp: 30, bonus_count: 0 } }
  ]
};

const PAGES = [
  { key: "answer", label: "MIA", empty: "" },
  { key: "ask", label: "Ask MIA", empty: "" },
  { key: "attention", label: "Needs attention", empty: "All clear. Nothing needs you." },
  { key: "proposals", label: "Proposals", empty: "No proposals awaiting review." },
  { key: "tracked", label: "Tracked", empty: "Nothing tracked yet." },
  { key: "next_up", label: "Next up", empty: "All clear." },
  { key: "quests", label: "Today's quests", empty: "No quests yet — enjoy the day." },
  { key: "suggested", label: "MIA suggests", empty: "Nothing suggested right now — she'll speak up when she notices something." }
];

let STATE = MOCK;
let page = 0;
let openId = null;

/* Persistence (decisions + quest check-ins), guarded: storage can fail or
   be cleared on the device. */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("glance-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("glance-" + k, JSON.stringify(v)); } catch (e) {} }
};
let decisions = LS.get("decisions", {});
let doneQuests = LS.get("done", {});
let pendingAdds = LS.get("pending_adds", []);
let draftQuest = null;
/* Mission-acceptance flow: MIA's suggestions, one decision at a time. */
let sugDecisions = LS.get("sug_decisions", {});
let acceptedMissions = LS.get("accepted_missions", []);
let pendingSync = LS.get("pending_sync", []);
let confirmSug = null;
let celebrating = null;
/* Voice runtime: ask-anything routing, cooking sessions, workout logs. */
let voiceAnswer = null;      // {title, body, spoken} rendered response card
let cooking = null;          // {recipe, step} — step -1 = ingredients
let workoutDraft = null;     // {name, minutes} awaiting confirm
let pendingWorkouts = LS.get("pending_workouts", []);
let pendingWorkoutSync = LS.get("pending_workout_sync", []);

const RARITY_COLOR = {
  Common: "#c9d4dc", Uncommon: "#7dd87d", Rare: "#3ec6ff",
  Epic: "#c77dff", Legendary: "#ffb02e"
};

function visibleSuggestions() {
  return (STATE.suggested || []).filter(s => !sugDecisions[s.id]);
}
function visibleQuests() {
  const base = (STATE.quests || []).concat(
    acceptedMissions.filter(a => !(STATE.quests || []).some(q => q.id === a.id)));
  return base;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function summaryText() {
  const a = (STATE.attention || []).length;
  const p = (STATE.proposals || []).filter(x => !decisions[x.id]).length;
  const q = visibleQuests().filter(x => !doneQuests[x.id]).length;
  const s = visibleSuggestions().length;
  const bits = [a ? a + (a === 1 ? " thing needs" : " things need") + " you" : "nothing needs you"];
  if (p) bits.push(p + (p === 1 ? " proposal waiting" : " proposals waiting"));
  if (s) bits.push(s + (s === 1 ? " suggestion waiting" : " suggestions waiting"));
  if (q) bits.push(q + (q === 1 ? " quest open" : " quests open"));
  bits.push("all else quiet");
  return bits.join(" · ") + ".";
}

function expandPanel(item) {
  const p = el("div", "expand sev-" + (item.severity || "info"));
  const prop = item.proposal;
  if (prop) {
    p.append(el("span", "tag", prop.real ? "HOMESTEAD QUEUE" : "PREVIEW"));
    if (prop.summary) p.append(el("div", "dsum", prop.summary));
    if (prop.evidence && prop.evidence.length) {
      const ul = el("ul", "ev");
      for (const e of prop.evidence) ul.append(el("li", null, e));
      p.append(ul);
    }
    if (prop.safety) p.append(el("div", "safety", prop.safety));
  } else if (item.detail) {
    p.append(el("div", "dsum", item.detail));
  }
  const btns = el("div", "btns");
  if (prop) {
    const ap = el("button", "btn primary", prop.approve_label || "Approve");
    ap.type = "button";
    ap.addEventListener("click", () => decide(item.id, "approved"));
    const dm = el("button", "btn", prop.dismiss_label || "Dismiss");
    dm.type = "button";
    dm.addEventListener("click", () => decide(item.id, "dismissed"));
    btns.append(ap); btns.append(dm);
  }
  const bk = el("button", "btn", "← Collapse");
  bk.type = "button";
  bk.addEventListener("click", closeDetail);
  btns.append(bk);
  p.append(btns);
  const dec = decisions[item.id];
  if (dec === "approved")
    p.append(el("div", "note", "Approved — saved on this device. Sending the decision to the homestead queue is coming next."));
  else if (dec === "dismissed")
    p.append(el("div", "note", "Dismissed."));
  if (!prop)
    p.append(el("div", "full", "Full detail lives on the phone / desktop — the glasses stay glanceable."));
  return p;
}

function cardBtn(item, isQuest) {
  const b = el("button", "card sev-" + (item.severity || "info"));
  b.type = "button";
  b.append(el("span", "area", item.area || ""));
  b.append(el("span", "ctitle", item.title || ""));
  if (item.detail) b.append(el("span", "cdetail", item.detail));
  const row = el("span", "row");
  if (isQuest) {
    const left = el("span");
    left.append(el("span", "check" + (doneQuests[item.id] ? " done" : "")));
    left.append(el("span", "action", doneQuests[item.id] ? "Done" : "Check in"));
    row.append(left);
    row.append(el("span", "xp", "+" + (item.xp || 10) + " XP"));
    if (doneQuests[item.id]) b.classList.add("decided");
    b.setAttribute("aria-pressed", doneQuests[item.id] ? "true" : "false");
    b.addEventListener("click", () => {
      doneQuests[item.id] = !doneQuests[item.id];
      LS.set("done", doneQuests);
      render(false);
    });
  } else {
    let act = item.action || "Open";
    const dec = decisions[item.id];
    if (dec === "approved") act = "Approved";
    else if (dec === "dismissed") act = "Dismissed";
    if (openId === item.id) act = "Close";
    row.append(el("span", "action", act + " →"));
    if (dec) b.classList.add("decided");
    b.addEventListener("click", () => toggleDetail(item.id));
  }
  b.append(row);
  return b;
}


const SEV_RANK = { critical: 0, warning: 1, info: 2 };

/* ---- Mission-acceptance flow ----
   suggestion -> explicit confirm -> accepted mission -> "New Mission" celebration.
   Dismissals are recorded too; the exporter's novelty ledger keeps rejected
   suggestions quiet for a week. Decisions POST to the laptop loop
   (tools/serve.py); without it they stay on this device, marked pending —
   the same honesty pattern as drafted quests. */
function suggestionCard(s) {
  const b = el("button", "card sev-info");
  b.type = "button";
  b.append(el("span", "area", (s.area || "Missions") + " · MIA noticed"));
  const epic = el("span", "epic");
  epic.textContent = (s.voice && s.voice.epic_title) || s.epic_name || s.title;
  b.append(epic);
  if (s.title) b.append(el("span", "cdetail", s.title));
  if (s.reason) b.append(el("span", "reason", "\u201C" + s.reason + "\u201D"));
  const row = el("span", "row");
  const left = el("span");
  left.append(el("span", "xp", "+" + (s.xp || 10) + " XP"));
  const rar = el("span", "rar rar-" + (s.rarity || "Common"));
  rar.textContent = s.rarity || "Common";
  left.append(rar);
  row.append(left);
  row.append(el("span", "action", (openId === s.id ? "Close" : "Review") + " \u2192"));
  b.append(row);
  b.addEventListener("click", () => toggleDetail(s.id));
  return b;
}

function suggestionPanel(s) {

function recordDecision(s, decision) {
  sugDecisions[s.id] = { decision, at: new Date().toISOString() };
  LS.set("sug_decisions", sugDecisions);
  const payload = { id: s.id, decision, at: sugDecisions[s.id].at, snapshot: s };
  fetch("api/mission-decision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(r => {
    if (!r.ok) throw new Error("http " + r.status);
    pendingSync = pendingSync.filter(id => id !== s.id);
    LS.set("pending_sync", pendingSync);
    render(false);
  }).catch(() => {
    if (!pendingSync.includes(s.id)) {
      pendingSync.push(s.id);
      LS.set("pending_sync", pendingSync);
    }
    render(false);
  });
}

function decideSuggestion(s, decision) {
  recordDecision(s, decision);
  if (openId === s.id) openId = null;
  render(true);
}

function acceptSuggestion(s) {
  const quest = {
    id: s.id, area: s.area || "Missions", title: s.title, detail: s.detail,
    xp: s.xp || 10, epic_name: s.epic_name, bonus_tasks: s.bonus_tasks || [],
    voice: s.voice, rarity: s.rarity, from_suggestion: true
  };
  if (!acceptedMissions.some(q => q.id === quest.id)) {
    acceptedMissions.push(quest);
    LS.set("accepted_missions", acceptedMissions);
  }
  recordDecision(s, "accepted");
  celebrating = s.voice || { epic_title: s.epic_name || s.title, rarity: s.rarity,
    reward_lines: ["+" + (s.xp || 10) + " XP"], total_xp: s.xp || 10 };
  // Spoken missions: the fanfare is visual; the voice stays calm —
  // one line, per the voice settings.
  const vs = voiceSettings();
  if (vs.voice_enabled !== false && vs.speak_missions !== false) {
    speak("New mission: " + (celebrating.epic_title || s.title) +
          ". Plus " + (s.xp || 10) + " XP.");
  }
  render(true);
}
/* ---- Voice runtime ----
   Ask-anything routing over the exporter's voice payload (scripts,
   intents, cookbook). Same data as the glance, so she never disagrees
   with herself across surfaces. Spoken answers stay short; speech is
   enhancement — the card always stays visible. */
function voiceSettings() {
  // Merges exporter defaults (state.voice.settings) with this device's
  // overrides (localStorage). The surface reads through this everywhere.
  const base = ((STATE.voice || {}).settings) || {};
  let local = {};
  try { local = JSON.parse(localStorage.getItem("mia_voice_settings") || "{}"); }
  catch (e) { local = {}; }
  return Object.assign({
    frequency: "normal", verbosity: "brief",
    speak_missions: true, voice_enabled: true,
  }, base, local);
}

function saveVoiceSettings(patch) {
  const cur = voiceSettings();
  const next = Object.assign({}, cur, patch);
  delete next.gate; delete next.frequency_label; delete next.verbosity_label;
  try { localStorage.setItem("mia_voice_settings", JSON.stringify(next)); }
  catch (e) {}
  // Best-effort sync to the dev server so the next export carries it.
  try {
    fetch("/api/voice-settings", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(next)
    }).catch(() => {});
  } catch (e) {}
  render(false);
}

function speak(text) {
  if (!text) return;
  if (voiceSettings().voice_enabled === false) return;
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
         "-" + String(d.getDate()).padStart(2, "0");
}

function voiceRespond(title, body, spoken) {
  voiceAnswer = { title, body, spoken: spoken || body };
  speak(voiceAnswer.spoken);
  render(false);
}

function routeVoiceQuery(raw) {
  const t = (raw || "").toLowerCase().trim();
  if (!t) return;
  const V = STATE.voice || {};
  const brief = STATE.brief || {};
  const scripts = V.scripts || {};
  // In a cooking session, Next / Repeat / Done win over everything.
  if (cooking) {
    if (/\bdone\b/.test(t) || /\bfinish\b/.test(t)) { endCooking(); return; }
    if (/\brepeat\b/.test(t) || /\bagain\b/.test(t)) { cookStep(true); return; }
    if (/\bnext\b/.test(t) || /\bcontinue\b/.test(t) || /\bgo on\b/.test(t) || /\bstart\b/.test(t)) { cookStep(false); return; }
  }
  // "Log my workout: push day, 40 minutes" — confirm-gated write.
  if (/^\s*log\b/.test(t)) { parseWorkoutLog(t); return; }
  // "Read me the teriyaki recipe."
  if (/\brecipe\b/.test(t) || /^\s*(cook|read me)\b/.test(t)) { findRecipe(t); return; }
  // Self-scripts (rule zero: she explains herself, simply).
  if (t.includes("who are you") || t.includes("your name")) { voiceRespond("Who I am", scripts.who); return; }
  if (t.includes("what can you do")) { voiceRespond("What I can do", scripts.can); return; }
  if (t.includes("what do you know")) { voiceRespond("What I know", scripts.know); return; }
  if (t.includes("help") || t.includes("what can i ask")) { voiceRespond("Help", scripts.help); return; }
  // Brief reads via the exporter's intent table (first match wins).
  for (const it of (V.intents || [])) {
    if (it.kind !== "brief") continue;
    if ((it.patterns || []).some(p => t.includes(p))) {
      const ans = brief[it.target];
      voiceRespond(it.intent, ans || "No data on that right now.");
      return;
    }
  }
  // One clarification, then silence — she never guesses.
  voiceRespond("Hmm", "I didn't catch that \u2014 try 'Help' to hear what I can do.");
}

function findRecipe(t) {
  const books = ((STATE.voice || {}).cookbook) || [];
  const q = t.replace(/\b(read me|the|a|an|recipe|recipes|cook|cooking|please|for me)\b/g, " ")
             .replace(/\s+/g, " ").trim();
  const hit = books.find(b => {
    const n = (b.name || "").toLowerCase();
    return n && (n.includes(q) || (q && q.includes(n)));
  });
  if (!hit) {
    const names = books.map(b => b.name).filter(Boolean);
    voiceRespond("Recipes", names.length
      ? "I don't have that one \u2014 I know: " + names.join(", ") + "."
      : "No recipes loaded right now.");
    return;
  }
  cooking = { recipe: hit, step: -1 };
  render(false);
  const ing = hit.ingredients.length
    ? " You'll need: " + hit.ingredients.join("; ") + "."
    : "";
  speak(hit.name + "." + ing + " Say 'start cooking' when ready.");
}

function cookStep(repeat) {
  if (!cooking) return;
  const r = cooking.recipe;
  if (!repeat) cooking.step += 1;
  if (cooking.step >= r.steps.length) { endCooking(); return; }
  render(false);
  const n = cooking.step + 1;
  speak("Step " + n + " of " + r.steps.length + ". " + r.steps[cooking.step]);
}

function endCooking() {
  if (!cooking) return;
  const name = cooking.recipe.name;
  cooking = null;
  voiceRespond("Done", "Enjoy your " + name + "!", "Done \u2014 enjoy!");
}

function parseWorkoutLog(t) {
  let rest = t.replace(/^\s*log(\s+my)?(\s+workout)?\s*:?\s*/, "");
  const m = rest.match(/(\d+)\s*(minutes|minute|mins|min)\b/);
  const minutes = m ? parseInt(m[1], 10) : null;
  let name = m ? rest.replace(m[0], "") : rest;
  name = name.replace(/[,.\s]+$/g, "").trim();
  if (!name) {
    voiceRespond("Log workout", "What should I call it? Try: 'Log my workout: push day, 40 minutes.'");
    return;
  }
  // Title-case the name for the card.
  name = name.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1));
  workoutDraft = { name, minutes, date: todayISO() };
  render(false);
  speak(name + (minutes ? ", " + minutes + " minutes" : "") + ", today. Log it?");
}

function confirmWorkoutLog() {
  if (!workoutDraft) return;
  const entry = {
    date: workoutDraft.date,
    name: workoutDraft.name,
    duration_minutes: workoutDraft.minutes,
    logged_at: new Date().toISOString(),
    channel: "voice"
  };
  pendingWorkouts.push(entry);
  LS.set("pending_workouts", pendingWorkouts);
  fetch("api/workout-log", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(entry)
  }).then(r => {
    if (!r.ok) throw new Error("http " + r.status);
    pendingWorkoutSync = pendingWorkoutSync.filter(x => x !== entry);
    LS.set("pending_workout_sync", pendingWorkoutSync);
    render(false);
  }).catch(() => {
    if (!pendingWorkoutSync.includes(entry)) {
      pendingWorkoutSync.push(entry);
      LS.set("pending_workout_sync", pendingWorkoutSync);
    }
    render(false);
  });
  workoutDraft = null;
  voiceRespond("Logged", entry.name + (entry.duration_minutes ? ", " + entry.duration_minutes + " minutes" : "") + " \u2014 logged for today.");
}

function renderVoiceAnswer(box) {
  // Cooking session UI takes over the answer area.
  if (cooking) {
    const r = cooking.recipe;
    const w = el("div", "expand sev-info");
    w.append(el("span", "tag", "COOKING MODE"));
    w.append(el("div", "ctitle", r.name));
    if (cooking.step < 0) {
      if (r.ingredients.length) {
        const ul = el("ul", "ev");
        for (const ing of r.ingredients) ul.append(el("li", null, ing));
        w.append(ul);
      }
      const btns = el("div", "btns");
      const st = el("button", "btn primary", "Start cooking");
      st.type = "button";
      st.addEventListener("click", () => cookStep(false));
      const q = el("button", "btn", "Done");
      q.type = "button";
      q.addEventListener("click", endCooking);
      btns.append(st); btns.append(q);
      w.append(btns);
      w.append(el("div", "full", "Hands on the food \u2014 say \"next\", \"repeat\", or \"done\"."));
    } else {
      w.append(el("div", "dsum", "Step " + (cooking.step + 1) + " of " + r.steps.length));
      w.append(el("div", "dsum", r.steps[cooking.step]));
      const btns = el("div", "btns");
      const nx = el("button", "btn primary", cooking.step + 1 >= r.steps.length ? "Finish" : "Next");
      nx.type = "button";
      nx.addEventListener("click", () => cookStep(false));
      const rp = el("button", "btn", "Repeat");
      rp.type = "button";
      rp.addEventListener("click", () => cookStep(true));
      const dn = el("button", "btn", "Done");
      dn.type = "button";
      dn.addEventListener("click", endCooking);
      btns.append(nx); btns.append(rp); btns.append(dn);
      w.append(btns);
    }
    box.append(w);
    return;
  }
  // Workout confirm gate: she repeats it back; nothing writes unconfirmed.
  if (workoutDraft) {
    const w = el("div", "expand sev-info");
    w.append(el("span", "tag", "LOG WORKOUT?"));
    w.append(el("div", "dsum", workoutDraft.name +
      (workoutDraft.minutes ? ", " + workoutDraft.minutes + " minutes" : "") +
      ", today. Log it?"));
    const btns = el("div", "btns");
    const yes = el("button", "btn primary", "Log it");
    yes.type = "button";
    yes.addEventListener("click", confirmWorkoutLog);
    const no = el("button", "btn", "Cancel");
    no.type = "button";
    no.addEventListener("click", () => { workoutDraft = null; render(false); });
    btns.append(yes); btns.append(no);
    w.append(btns);
    w.append(el("div", "full", "No confirm, no write \u2014 ever."));
    box.append(w);
    return;
  }
  if (voiceAnswer) {
    const w = el("div", "expand sev-info");
    w.append(el("span", "tag", "MIA"));
    w.append(el("div", "dsum", voiceAnswer.body));
    box.append(w);
  }
  if (pendingWorkouts.length) {
    box.append(el("div", "note", pendingWorkouts.length + " workout" + (pendingWorkouts.length === 1 ? "" : "s") +
      " logged on this device \u2014 syncs to MIA on the next export."));
  }
}

const BRIEF_CHIPS = [
  { key: "attention", area: "Ask MIA", phrase: "\u201CWhat needs me?\u201D" },
  { key: "greenhouse", area: "Greenhouse", phrase: "\u201CWhat's the greenhouse doing?\u201D" },
  { key: "finance", area: "Budget", phrase: "\u201CHow's my budget?\u201D" },
  { key: "workout", area: "Workout", phrase: "\u201CAm I keeping up?\u201D" },
  { key: "kitchen", area: "Kitchen", phrase: "\u201CWhat's in the pantry?\u201D" },
  { key: "proposals", area: "Proposals", phrase: "\u201CAny proposals waiting?\u201D" },
  { key: "quests", area: "Today's quests", phrase: "\u201CWhat are my quests?\u201D" }
];

/* The answer-first home: exporter sends `answer`; if absent, compute the
   same result from the sections so the home never disagrees with them. */
function computeAnswer() {
  if (STATE.answer && STATE.answer.headline) return STATE.answer;
  const ranked = [...(STATE.attention || [])].sort((a, b) =>
    (SEV_RANK[a.severity] ?? 2) - (SEV_RANK[b.severity] ?? 2));
  let headline, focus = null;
  if (ranked.length) {
    const n = ranked.length;
    headline = n + " thing" + (n === 1 ? "" : "s") + " need" + (n === 1 ? "s" : "") + " you.";
    focus = { id: ranked[0].id, title: ranked[0].title, area: ranked[0].area };
  } else headline = "Everything is quiet.";
  const p = (STATE.proposals || []).filter(x => !decisions[x.id]).length;
  const q = (STATE.quests || []).filter(x => !doneQuests[x.id]).length;
  const parts = [];
  if (p) parts.push(p + " proposal" + (p === 1 ? "" : "s") + " waiting");
  if (q) parts.push(q + " quest" + (q === 1 ? "" : "s") + " open");
  return { headline, focus, sub: parts.length ? parts.join(" \u00b7 ") + "." : "No proposals or quests waiting." };
}

function renderAnswer(box) {
  const A = computeAnswer();
  box.append(el("div", "headline", A.headline));
  if (A.focus) {
    const item = (STATE.attention || []).find(x => x.id === A.focus.id) || A.focus;
    const b = el("button", "card sev-" + (item.severity || "info"));
    b.type = "button";
    b.append(el("span", "area", item.area || ""));
    b.append(el("span", "ctitle", item.title || ""));
    if (item.detail) b.append(el("span", "cdetail", item.detail));
    const row = el("span", "row");
    row.append(el("span", "action", "View \u2192"));
    b.append(row);
    b.addEventListener("click", () => {
      page = PAGES.findIndex(p => p.key === "attention");
      openId = item.id;
      try { history.pushState({ glanceDetail: item.id }, ""); } catch (e) {}
      render(true);
    });
    box.append(b);
  } else {
    box.append(el("div", "sub", "Nothing pending your decision right now."));
  }
  box.append(el("div", "sub", A.sub));
  const btns = el("div", "homebtns");
  const sec = el("button", "hbtn primary", "Sections \u2192");
  sec.type = "button";
  sec.addEventListener("click", () => gotoPage(PAGES.findIndex(p => p.key === "attention")));
  const ask = el("button", "hbtn", "Ask MIA");
  ask.type = "button";
  ask.addEventListener("click", () => gotoPage(1));
  btns.append(sec); btns.append(ask);
  box.append(btns);
}

function renderAsk(box) {
  box.append(el("div", "sub", "Ask anything \u2014 type or dictate below, she answers out loud. Her best questions are printed so you never guess the words."));
  const qin = document.createElement("input");
  qin.className = "askinput"; qin.type = "text";
  qin.placeholder = '\u201CWhat bills are due?\u201D \u00b7 \u201CRead me the teriyaki recipe\u201D \u00b7 \u201CLog my workout: push day, 40 minutes\u201D';
  qin.setAttribute("aria-label", "Ask MIA anything");
  const qbtn = el("button", "btn primary", "Ask MIA");
  qbtn.type = "button";
  const askNow = () => {
    const t = (qin.value || "").trim();
    if (!t) { qin.focus(); return; }
    qin.value = "";
    routeVoiceQuery(t);
  };
  qbtn.addEventListener("click", askNow);
  qin.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); askNow(); }
    e.stopPropagation();
  });
  box.append(qin); box.append(qbtn);
  renderVoiceAnswer(box);
  const brief = STATE.brief || {};
  for (const chip of BRIEF_CHIPS) {
    const ans = brief[chip.key];
    if (!ans) continue;
    const id = "chip-" + chip.key;
    const b = el("button", "card sev-info");
    b.type = "button";
    b.append(el("span", "area", chip.area));
    b.append(el("span", "ctitle", chip.phrase));
    const row = el("span", "row");
    row.append(el("span", "action", openId === id ? "Close" : "Hear her answer \u2192"));
    b.append(row);
    b.addEventListener("click", () => toggleDetail(id));
    box.append(b);
    if (openId === id) {
      const p = el("div", "expand sev-info");
      p.append(el("div", "dsum", ans));
      p.append(el("div", "full", "Answered from the exporter's brief \u2014 the same sentence she would speak."));
      box.append(p);
    }
  }
  box.append(el("div", "sub", "Add a quest"));
  const input = document.createElement("input");
  input.className = "askinput"; input.type = "text";
  input.placeholder = "e.g. Water the seedlings";
  input.setAttribute("aria-label", "Quest title");
  const chk = el("label", "chkrow");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  chk.append(cb); chk.append(document.createTextNode("Daily quest"));
  const mk = el("button", "btn primary", "Draft quest");
  mk.type = "button";
  mk.addEventListener("click", () => {
    const title = (input.value || "").trim();
    if (!title) { input.focus(); return; }
    draftQuest = { title, daily: !!cb.checked, xp: 10 };
    render(true);
  });
  box.append(input); box.append(chk); box.append(mk);
  if (draftQuest) {
    const d = el("div", "expand sev-info");
    d.append(el("span", "tag", "DRAFT QUEST"));
    d.append(el("div", "dsum", draftQuest.title + " \u00b7 +" + draftQuest.xp + " XP" + (draftQuest.daily ? " \u00b7 daily" : "")));
    const btns = el("div", "btns");
    const cf = el("button", "btn primary", "Add quest");
    cf.type = "button";
    cf.addEventListener("click", () => {
      pendingAdds = pendingAdds.concat([draftQuest]);
      LS.set("pending_adds", pendingAdds);
      draftQuest = null;
      render(true);
    });
    const cn = el("button", "btn", "Cancel");
    cn.type = "button";
    cn.addEventListener("click", () => { draftQuest = null; render(true); });
    btns.append(cf); btns.append(cn);
    d.append(btns);
    box.append(d);
  }
  if (pendingAdds.length) {
    box.append(el("div", "note", pendingAdds.length + " quest" + (pendingAdds.length === 1 ? "" : "s") +
      " queued on this device \u2014 waiting to sync to MIA's missions."));
  }
  renderVoiceSettings(box);
}

/* ---- Voice settings ----
   Frequency and verbosity are per-user preferences, not constants.
   The gate stays conservative by default (less friction, not more
   notifications); the user picks how chatty she is allowed to be. */
const VOICE_FREQUENCY_OPTIONS = ["quiet", "normal", "chatty"];
const VOICE_VERBOSITY_OPTIONS = ["brief", "normal"];

function renderVoiceSettings(box) {
  const s = voiceSettings();
  box.append(el("div", "sub", "Her voice, your rules"));
  const card = el("div", "card sev-info");
  card.append(el("span", "area", "VOICE SETTINGS"));
  card.append(el("span", "ctitle", "How often she speaks, and how much"));

  const gate = s.gate || {};
  const freqRow = el("div", "row");
  freqRow.append(el("span", "action", "Frequency \u2014 " + (s.frequency_label || s.frequency)));
  const freqBtns = el("div", "btns");
  for (const f of VOICE_FREQUENCY_OPTIONS) {
    const b = el("button", "btn" + (s.frequency === f ? " primary" : ""), f);
    b.type = "button";
    b.addEventListener("click", () => saveVoiceSettings({ frequency: f }));
    freqBtns.append(b);
  }
  freqRow.append(freqBtns);
  card.append(freqRow);
  card.append(el("div", "full", "Currently: up to " + (gate.max_proactive_per_day ?? 5) +
    " nudges a day, " + (gate.min_spacing_minutes ?? 90) + "+ minutes apart."));

  const verbRow = el("div", "row");
  verbRow.append(el("span", "action", "Verbosity \u2014 " + (s.verbosity_label || s.verbosity)));
  const verbBtns = el("div", "btns");
  for (const v of VOICE_VERBOSITY_OPTIONS) {
    const b = el("button", "btn" + (s.verbosity === v ? " primary" : ""), v);
    b.type = "button";
    b.addEventListener("click", () => saveVoiceSettings({ verbosity: v }));
    verbBtns.append(b);
  }
  verbRow.append(verbBtns);
  card.append(verbRow);

  const spkRow = el("div", "row");
  spkRow.append(el("span", "action", "Announce new missions out loud"));
  const spk = el("button", "btn" + (s.speak_missions !== false ? " primary" : ""), s.speak_missions !== false ? "On" : "Off");
  spk.type = "button";
  spk.addEventListener("click", () => saveVoiceSettings({ speak_missions: !(s.speak_missions !== false) }));
  spkRow.append(spk);
  card.append(spkRow);

  const masterRow = el("div", "row");
  masterRow.append(el("span", "action", "Her voice"));
  const mst = el("button", "btn" + (s.voice_enabled !== false ? " primary" : ""), s.voice_enabled !== false ? "On" : "Muted");
  mst.type = "button";
  mst.addEventListener("click", () => saveVoiceSettings({ voice_enabled: !(s.voice_enabled !== false) }));
  masterRow.append(mst);
  card.append(masterRow);

  card.append(el("div", "full", "Settings save on this device and sync into the next export \u2014 she never disagrees with herself."));
  box.append(card);
}

function render(refocus) {
  document.getElementById("summary").textContent = summaryText();
  document.getElementById("pagetitle").textContent = PAGES[page].label;
  const dots = document.getElementById("dots");
  dots.replaceChildren();
  PAGES.forEach((p, i) => dots.append(el("span", "dot" + (i === page ? " on" : ""))));
  const box = document.getElementById("page");
  box.replaceChildren();
  const pg = PAGES[page];
  document.getElementById("summary").style.display = pg.key === "answer" ? "none" : "";
  if (pg.key === "answer") renderAnswer(box);
  else if (pg.key === "ask") renderAsk(box);
  else if (pg.key === "suggested") {
    const items = visibleSuggestions();
    if (!items.length) { box.append(el("div", "empty", pg.empty)); }
    for (const s of items) {
      box.append(suggestionCard(s));
      if (openId === s.id) box.append(suggestionPanel(s));
    }
    const pend = pendingSync.filter(id => sugDecisions[id]);
    if (pend.length) box.append(el("div", "note",
      pend.length + (pend.length === 1 ? " decision" : " decisions") +
      " queued on this device — syncs on the next laptop export."));
  }
  else {
    const items = pg.key === "quests" ? visibleQuests() : (STATE[pg.key] || []);
    if (!items.length) { box.append(el("div", "empty", pg.empty)); }
    const isQuest = pg.key === "quests";
    for (const item of items) {
      box.append(cardBtn(item, isQuest));
      if (!isQuest && openId === item.id) box.append(expandPanel(item));
    }
  }
  if (confirmSug) {
    const s = visibleSuggestions().find(x => x.id === confirmSug);
    if (s) box.append(confirmOverlay(s));
    else confirmSug = null;
  }
  if (celebrating) box.append(celebrationOverlay(celebrating));
  if (refocus) {
    const first = box.querySelector(".card, .btn");
    if (first) first.focus({ preventScroll: true });
  }
}

function gotoPage(i) {
  page = (i + PAGES.length) % PAGES.length;
  openId = null;
  render(true);
}

/* Detail expansion rides browser history so the shell's Back collapses it. */
function toggleDetail(id) {
  if (openId === id) { closeDetail(); return; }
  openId = id;
  try { history.pushState({ glanceDetail: id }, ""); } catch (e) {}
  render(true);
}
function closeDetail() {
  if (openId == null) return;
  openId = null;
  render(true);
}
function decide(id, v) {
  decisions[id] = v;
  LS.set("decisions", decisions);
  render(true);
}

document.getElementById("navPrev").addEventListener("click", () => gotoPage(page - 1));
document.getElementById("navNext").addEventListener("click", () => gotoPage(page + 1));

window.addEventListener("popstate", () => { if (openId != null) closeDetail(); });

document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); gotoPage(page + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); gotoPage(page - 1); }
  else if (e.key === "Escape") {
    e.preventDefault();
    if (celebrating) { celebrating = null; render(true); }
    else if (confirmSug) { confirmSug = null; render(true); }
    else closeDetail();
  }
  else if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey && !e.altKey) refresh();
});

/* Up/Down stays within the page: the browser's spatial navigation handles
   ordinary movement; we keep focus inside .page so it never gets lost. */
document.getElementById("page").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const f = [...document.querySelectorAll("#page .card, #page .btn")];
  const i = f.indexOf(document.activeElement);
  if (i === -1) return;
  e.preventDefault();
  const n = e.key === "ArrowDown" ? f[i + 1] : f[i - 1];
  if (n) { n.focus(); n.scrollIntoView({ block: "nearest" }); }
});

async function loadState() {
  try {
    const r = await fetch("state.json", { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const s = await r.json();
    s.meta = s.meta || {}; s.meta.source = "live";
    return s;
  } catch (e) { return MOCK; }
}

async function refresh() {
  if (openId != null) return; // don't disturb an open detail
  STATE = await loadState();
  render(false);
}

function tick() {
  const d = new Date();
  const h = d.getHours() % 12 || 12;
  document.getElementById("clock").textContent =
    h + ":" + String(d.getMinutes()).padStart(2, "0") + (d.getHours() >= 12 ? " PM" : " AM");
}
tick(); setInterval(tick, 20000);

loadState().then(s => { STATE = s; render(true); });
setInterval(refresh, 60000);
</script>
</body>
