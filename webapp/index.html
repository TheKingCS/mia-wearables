<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="MIA Glance — glanceable MIA cards for Meta Ray-Ban Display: needs attention, proposals, tracked, next up, and today's quests.">
<title>MIA Glance</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --bg: #000; --panel: #0d1419; --panel2: #0a1116;
    --line: #22303a; --text: #f2f8fc; --dim: #c2d7e2; --faint: #8fb6c9;
    --accent: #3ec6ff; --accent-ink: #06121a;
    --critical: #ff5a4e; --warning: #ffb02e; --info: #3ec6ff;
    --xp: #ffd166; --ok: #a5d98f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 600px; height: 600px; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app { display: flex; flex-direction: column; height: 600px; padding: 18px 20px 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .06em; }
  .clock { font-size: 17px; color: #a8c8da; font-variant-numeric: tabular-nums; }
  .status { font-size: 12px; letter-spacing: .1em; color: var(--accent); margin-top: 6px; }
  .xpbar { height: 5px; border-radius: 3px; background: #16202a; margin: 8px 0 10px; overflow: hidden; }
  .xpfill { width: 62%; height: 100%; background: var(--accent); border-radius: 3px; }
  .summary { font-size: 17px; line-height: 1.4; color: #d7e8f2; min-height: 24px; }
  .pagehead { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
  .nav {
    cursor: pointer; font: inherit; font-size: 24px; line-height: 1; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid #2b3d49; background: var(--panel); color: var(--accent);
  }
  .nav:focus-visible, .card:focus-visible, .btn:focus-visible {
    outline: 2px solid #4fd8ff; outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(79,216,255,.25);
  }
  .pagetitle { flex: 1; text-align: center; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #2b3d49; }
  .dot.on { background: var(--accent); }
  .page { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--info);
    color: var(--text); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; font: inherit;
  }
  .card.sev-critical { border-left-color: var(--critical); }
  .card.sev-warning { border-left-color: var(--warning); }
  .card.sev-info { border-left-color: var(--info); }
  .card.decided { opacity: .7; }
  .area { display: block; font-size: 11px; letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }
  .ctitle { display: block; font-size: 20px; font-weight: 600; margin-top: 3px; line-height: 1.25; }
  .cdetail { display: block; font-size: 16px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
  .action { font-size: 15px; color: var(--accent); font-weight: 600; }
  .xp { font-size: 15px; color: var(--xp); font-weight: 700; }
  .check {
    display: inline-block; width: 19px; height: 19px; border-radius: 50%;
    border: 2px solid var(--accent); vertical-align: -4px; margin-right: 8px; position: relative;
  }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check.done::after {
    content: ""; position: absolute; left: 5.5px; top: 2.5px; width: 5px; height: 9.5px;
    border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .empty { color: var(--faint); font-size: 16px; padding: 26px 6px; text-align: center; }
  .expand {
    background: var(--panel2); border: 1px solid var(--line); border-left: 5px solid var(--info);
    border-radius: 12px; padding: 14px; margin: -2px 0 12px;
  }
  .expand.sev-critical { border-left-color: var(--critical); }
  .expand.sev-warning { border-left-color: var(--warning); }
  .tag {
    display: inline-block; font-size: 11px; letter-spacing: .14em; color: var(--accent-ink);
    background: #7fd8ff; border-radius: 4px; padding: 2px 7px; font-weight: 700; margin-bottom: 9px;
  }
  .dsum { font-size: 16px; color: #d7e8f2; line-height: 1.45; }
  .ev { margin: 11px 0 0; padding-left: 19px; font-size: 15px; color: #b4cdd9; line-height: 1.55; }
  .safety {
    margin-top: 13px; font-size: 14px; color: var(--ok); background: #14210d;
    border: 1px solid #2c4520; border-radius: 8px; padding: 10px 12px; line-height: 1.5;
  }
  .btns { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 100px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 600;
    border-radius: 10px; padding: 12px 10px; border: 1px solid var(--accent);
    background: transparent; color: #7fd8ff;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .note { margin-top: 11px; font-size: 14px; color: var(--xp); }
  .full { font-size: 13px; color: #7193a5; margin-top: 11px; }
  .hint { font-size: 11.5px; color: #7193a5; padding-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">MIA</span>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="status">LEVEL 7 · 1,240 XP · 12-DAY STREAK</div>
  <div class="xpbar"><div class="xpfill"></div></div>
  <div class="summary" id="summary"></div>
  <div class="pagehead">
    <button class="nav" id="navPrev" type="button" aria-label="Previous section">&#8249;</button>
    <div class="pagetitle" id="pagetitle"></div>
    <button class="nav" id="navNext" type="button" aria-label="Next section">&#8250;</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="page" id="page"></div>
  <div class="hint" id="hint">&#8592;&#8594; section · &#8593;&#8595; cards · Enter opens · R refreshes</div>
</div>

<script>
"use strict";
/* Embedded fallback so the app renders even if state.json is unreachable. */
const MOCK = {
  meta: { source: "embedded-fallback" },
  attention: [
    { id: "alert-7", area: "Greenhouse", severity: "critical", title: "pH drift high",
      detail: "Cell 2 (Lettuce Raft) at 7.8 — target 6.8–7.2. Source: cell-2 · 3 occurrences.",
      action: "Open on phone", proposal: null },
    { id: "alert-9", area: "Greenhouse", severity: "warning", title: "Fish feeder 2 days overdue",
      detail: "Feeder A missed its refill window. Fish were fed manually.",
      action: "Open on phone", proposal: null }
  ],
  proposals: [
    { id: "exp-7", area: "Proposals", severity: "warning",
      title: "Test EC target maximum: 1.8 → 2.0",
      detail: "Raising EC max improves lettuce yield.", action: "Review",
      proposal: { real: true, kind: "experiment", row_id: 7,
        title: "Test EC target maximum: 1.8 → 2.0",
        summary: "Raising EC max improves lettuce yield.",
        evidence: ["Raising EC max improves lettuce yield.",
                   "Lettuce Raft: baseline 1.8, test 2.0",
                   "Runs until 2026-10-15", "Proposed by assistant"],
        safety: "Approval changes the target the control loop aims for. Every dose still passes the Safety MCU's hard limits (max pulse, min interval, 24h cap) — approval changes the target, never bypasses safety.",
        approve_label: "Start experiment", dismiss_label: "Dismiss" } }
  ],
  tracked: [
    { id: "trk-cell2", area: "Greenhouse · Cell 2", severity: "info",
      title: "pH 6.9 · EC 1.9 · 24.1°C",
      detail: "All in band. Stable 6 hours — twin agrees with sensors.",
      action: "Open twin", proposal: null }
  ],
  next_up: [
    { id: "maint-4", area: "Greenhouse", severity: "warning", title: "Sharpen mower blades",
      detail: "Overdue 12 days. Next mow window: Saturday.", action: "Open on phone", proposal: null },
    { id: "maint-5", area: "Garage", severity: "info", title: "Winterize pressure washer",
      detail: "First freeze risk in about 3 weeks.", action: "Open on phone", proposal: null }
  ],
  quests: [
    { id: "a1b2c3d4e5", area: "Field Season · Greenhouse", title: "Morning greenhouse check-in",
      detail: "Walk the cell, glance at the twin.", xp: 25 },
    { id: "k1l2m3n4o5", area: "Garage", title: "Calibrate pH pen",
      detail: "Due every 30 days — last done 34 days ago.", xp: 40 }
  ]
};

const PAGES = [
  { key: "attention", label: "Needs attention", empty: "All clear. Nothing needs you." },
  { key: "proposals", label: "Proposals", empty: "No proposals awaiting review." },
  { key: "tracked", label: "Tracked", empty: "Nothing tracked yet." },
  { key: "next_up", label: "Next up", empty: "All clear." },
  { key: "quests", label: "Today's quests", empty: "No quests yet — enjoy the day." }
];

let STATE = MOCK;
let page = 0;
let openId = null;

/* Persistence (decisions + quest check-ins), guarded: storage can fail or
   be cleared on the device. */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("glance-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("glance-" + k, JSON.stringify(v)); } catch (e) {} }
};
let decisions = LS.get("decisions", {});
let doneQuests = LS.get("done", {});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function summaryText() {
  const a = (STATE.attention || []).length;
  const p = (STATE.proposals || []).filter(x => !decisions[x.id]).length;
  const q = (STATE.quests || []).filter(x => !doneQuests[x.id]).length;
  const bits = [a ? a + (a === 1 ? " thing needs" : " things need") + " you" : "nothing needs you"];
  if (p) bits.push(p + (p === 1 ? " proposal waiting" : " proposals waiting"));
  if (q) bits.push(q + (q === 1 ? " quest open" : " quests open"));
  bits.push("all else quiet");
  return bits.join(" · ") + ".";
}

function expandPanel(item) {
  const p = el("div", "expand sev-" + (item.severity || "info"));
  const prop = item.proposal;
  if (prop) {
    p.append(el("span", "tag", prop.real ? "HOMESTEAD QUEUE" : "PREVIEW"));
    if (prop.summary) p.append(el("div", "dsum", prop.summary));
    if (prop.evidence && prop.evidence.length) {
      const ul = el("ul", "ev");
      for (const e of prop.evidence) ul.append(el("li", null, e));
      p.append(ul);
    }
    if (prop.safety) p.append(el("div", "safety", prop.safety));
  } else if (item.detail) {
    p.append(el("div", "dsum", item.detail));
  }
  const btns = el("div", "btns");
  if (prop) {
    const ap = el("button", "btn primary", prop.approve_label || "Approve");
    ap.type = "button";
    ap.addEventListener("click", () => decide(item.id, "approved"));
    const dm = el("button", "btn", prop.dismiss_label || "Dismiss");
    dm.type = "button";
    dm.addEventListener("click", () => decide(item.id, "dismissed"));
    btns.append(ap); btns.append(dm);
  }
  const bk = el("button", "btn", "← Collapse");
  bk.type = "button";
  bk.addEventListener("click", closeDetail);
  btns.append(bk);
  p.append(btns);
  const dec = decisions[item.id];
  if (dec === "approved")
    p.append(el("div", "note", "Approved — saved on this device. Sending the decision to the homestead queue is coming next."));
  else if (dec === "dismissed")
    p.append(el("div", "note", "Dismissed."));
  if (!prop)
    p.append(el("div", "full", "Full detail lives on the phone / desktop — the glasses stay glanceable."));
  return p;
}

function cardBtn(item, isQuest) {
  const b = el("button", "card sev-" + (item.severity || "info"));
  b.type = "button";
  b.append(el("span", "area", item.area || ""));
  b.append(el("span", "ctitle", item.title || ""));
  if (item.detail) b.append(el("span", "cdetail", item.detail));
  const row = el("span", "row");
  if (isQuest) {
    const left = el("span");
    left.append(el("span", "check" + (doneQuests[item.id] ? " done" : "")));
    left.append(el("span", "action", doneQuests[item.id] ? "Done" : "Check in"));
    row.append(left);
    row.append(el("span", "xp", "+" + (item.xp || 10) + " XP"));
    if (doneQuests[item.id]) b.classList.add("decided");
    b.setAttribute("aria-pressed", doneQuests[item.id] ? "true" : "false");
    b.addEventListener("click", () => {
      doneQuests[item.id] = !doneQuests[item.id];
      LS.set("done", doneQuests);
      render(false);
    });
  } else {
    let act = item.action || "Open";
    const dec = decisions[item.id];
    if (dec === "approved") act = "Approved";
    else if (dec === "dismissed") act = "Dismissed";
    if (openId === item.id) act = "Close";
    row.append(el("span", "action", act + " →"));
    if (dec) b.classList.add("decided");
    b.addEventListener("click", () => toggleDetail(item.id));
  }
  b.append(row);
  return b;
}

function render(refocus) {
  document.getElementById("summary").textContent = summaryText();
  document.getElementById("pagetitle").textContent = PAGES[page].label;
  const dots = document.getElementById("dots");
  dots.replaceChildren();
  PAGES.forEach((p, i) => dots.append(el("span", "dot" + (i === page ? " on" : ""))));
  const box = document.getElementById("page");
  box.replaceChildren();
  const pg = PAGES[page];
  const items = STATE[pg.key] || [];
  if (!items.length) { box.append(el("div", "empty", pg.empty)); }
  const isQuest = pg.key === "quests";
  for (const item of items) {
    box.append(cardBtn(item, isQuest));
    if (!isQuest && openId === item.id) box.append(expandPanel(item));
  }
  if (refocus) {
    const first = box.querySelector(".card, .btn");
    if (first) first.focus({ preventScroll: true });
  }
}

function gotoPage(i) {
  page = (i + PAGES.length) % PAGES.length;
  openId = null;
  render(true);
}

/* Detail expansion rides browser history so the shell's Back collapses it. */
function toggleDetail(id) {
  if (openId === id) { closeDetail(); return; }
  openId = id;
  try { history.pushState({ glanceDetail: id }, ""); } catch (e) {}
  render(true);
}
function closeDetail() {
  if (openId == null) return;
  openId = null;
  render(true);
}
function decide(id, v) {
  decisions[id] = v;
  LS.set("decisions", decisions);
  render(true);
}

document.getElementById("navPrev").addEventListener("click", () => gotoPage(page - 1));
document.getElementById("navNext").addEventListener("click", () => gotoPage(page + 1));

window.addEventListener("popstate", () => { if (openId != null) closeDetail(); });

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); gotoPage(page + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); gotoPage(page - 1); }
  else if (e.key === "Escape") { e.preventDefault(); closeDetail(); }
  else if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey && !e.altKey) refresh();
});

/* Up/Down stays within the page: the browser's spatial navigation handles
   ordinary movement; we keep focus inside .page so it never gets lost. */
document.getElementById("page").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const f = [...document.querySelectorAll("#page .card, #page .btn")];
  const i = f.indexOf(document.activeElement);
  if (i === -1) return;
  e.preventDefault();
  const n = e.key === "ArrowDown" ? f[i + 1] : f[i - 1];
  if (n) { n.focus(); n.scrollIntoView({ block: "nearest" }); }
});

async function loadState() {
  try {
    const r = await fetch("state.json", { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const s = await r.json();
    s.meta = s.meta || {}; s.meta.source = "live";
    return s;
  } catch (e) { return MOCK; }
}

async function refresh() {
  if (openId != null) return; // don't disturb an open detail
  STATE = await loadState();
  render(false);
}

function tick() {
  const d = new Date();
  const h = d.getHours() % 12 || 12;
  document.getElementById("clock").textContent =
    h + ":" + String(d.getMinutes()).padStart(2, "0") + (d.getHours() >= 12 ? " PM" : " AM");
}
tick(); setInterval(tick, 20000);

loadState().then(s => { STATE = s; render(true); });
setInterval(refresh, 60000);
</script>
</body>
</html>
